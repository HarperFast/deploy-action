name: Release
on:
  release:
    types: [released]
permissions: {}
jobs:
  major:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      major: ${{ steps.parse.outputs.major }}
    steps:
      - id: parse
        run: if [[ $RELEASE_TAG =~ ^v([0-9]+)\. ]]; then echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; fi
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
  major-tag:
    needs: major
    # GitHub keeps one pending run per group, so a group shared across majors could drop the only run for one of them.
    concurrency:
      group: release-v${{ needs.major.outputs.major }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Point the major tag at the newest release
        run: node scripts/moveMajorTag.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
